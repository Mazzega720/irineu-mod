plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Versão do mod + versão do Minecraft (ex.: 3.0.0+26.3). A tag do GitHub é só a do mod (v3.0.0).
version = "${project.mod_version}+${project.minecraft_version}"

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = 'GeckoLib'
				url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
			}
		}
		filter { includeGroupAndSubgroups('com.geckolib') }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"irineu" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib: modelos e animações do Blockbench para o BamBam e o Manoel Gomes.
	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Usado pelo lançamento (.github/workflows/release.yml): a tag v<versão> tem de bater com mod_version e o
// CHANGELOG.md tem de ter a seção "## [<versão>]" com alguma coisa escrita.
tasks.register("verifyReleaseVersion") {
	group = "verification"
	description = "Confere a tag de lançamento contra mod_version e o CHANGELOG.md."
	def modVersion = project.mod_version.toString()
	def tagVersion = providers.gradleProperty("releaseModVersion")
	def changelogFile = rootProject.file("CHANGELOG.md")
	doLast {
		def tag = tagVersion.orNull
		if (tag == null) throw new GradleException("Passe -PreleaseModVersion=<versão da tag v<versão>>")
		if (tag != modVersion) throw new GradleException("A tag ${tag} não bate com mod_version=${modVersion}")
		def changelog = changelogFile.getText("UTF-8")
		def heading = "## [${tag}]"
		def start = changelog.indexOf(heading)
		if (start < 0) throw new GradleException("O CHANGELOG.md não tem a seção ${heading}")
		def rest = changelog.substring(start + heading.length())
		def end = rest.indexOf("\n## [")
		def section = (end >= 0 ? rest.substring(0, end) : rest).trim()
		if (section.isEmpty()) throw new GradleException("A seção ${heading} do CHANGELOG.md está vazia")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "irineu-test"
		enableClientGameTests = true
		enableGameTests = false
	}
}
