# Lançamento: ao enviar uma tag v<versão> (ex.: v3.0.0), confere que ela bate com mod_version e com o
# CHANGELOG.md, compila e cria o Release do GitHub com o jar e as notas daquela versão.
# Também roda à mão (Actions > Release > Run workflow) com a versão: aí cria a tag v<versão> no commit escolhido.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a lançar (ex.: 3.2.0). Cria a tag v<versão> no commit da branch escolhida."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release (Java 25)
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.versao) || github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag is new (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "A tag ${RELEASE_TAG} já existe" >&2
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Validate tag and build
        run: |
          chmod +x gradlew
          ./gradlew verifyReleaseVersion build --no-daemon -PreleaseModVersion="${RELEASE_TAG#v}"

      - name: Select jar and release notes
        run: |
          shopt -s nullglob
          mkdir -p release-artifacts
          jars=()
          for f in build/libs/irineu-*.jar; do
            [[ "$f" == *-sources.jar ]] || jars+=("$f")
          done
          if (( ${#jars[@]} != 1 )); then
            echo "Esperava um jar do mod, achei ${#jars[@]}: ${jars[*]:-nenhum}" >&2
            exit 1
          fi
          cp "${jars[0]}" release-artifacts/
          version="${RELEASE_TAG#v}"
          awk -v h="## [${version}]" '
            index($0, h) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Seção ## [${version}] vazia ou ausente no CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo
            echo "---"
            echo "**Precisa de:** Minecraft 26.3, Fabric Loader 0.19.5+, Fabric API e GeckoLib 5.5.7+ (Fabric). Coloque o jar na pasta \`mods\`."
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: release-artifacts/*.jar
          body_path: release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-alpha') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-rc') }}
