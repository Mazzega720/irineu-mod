# Compila o mod (Minecraft 26.3, Java 25) a cada push e pull request e guarda o jar como artefato.
# Os testes de jogo (runClientGameTest) não rodam aqui: precisam de tela e são pesados.
name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 25)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Run Client GameTest (xvfb)
        env:
          IRINEU_TEST_ONLY: bacamarteiro
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: irineu-mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

      - name: Upload in-game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: in-game-screenshots
          path: |
            **/screenshots/*.png
            build/**/screenshots/*.png
            run/**/screenshots/*.png
          if-no-files-found: warn
